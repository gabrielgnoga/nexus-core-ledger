name: "Claude Code Review - Nexus Ledger"

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Nexus AI Auditor (Claude API)
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 1. Busca o Diff (código alterado) direto do Pull Request
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });

            // 2. Monta as instruções de auditoria
            const systemPrompt = `Você é um Engenheiro de Software Sênior especialista em Sistemas Financeiros e Ledgers.
            Revise este Pull Request focando estritamente em:
            1. Race conditions e concorrência (Threads).
            2. Arredondamentos e precisão matemática.
            3. Segurança e vazamento de dados sensíveis.
            Ignore formatação de código (espaços, vírgulas). Foque em arquitetura e bugs críticos.
            Seja direto e proponha o código corrigido.`;

            // 3. Chama a API oficial do Claude nativamente (usando Node.js Fetch)
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01',
                'content-type': 'application/json'
              },
              body: JSON.stringify({
                model: 'claude-3-haiku-20240307', // Modelo rápido e barato para CI
                max_tokens: 1500,
                system: systemPrompt,
                messages: [
                  { role: 'user', content: `Por favor, revise o seguinte diff do meu Pull Request apontando as falhas:\n\n${diff}` }
                ]
              })
            });

            const claudeData = await response.json();
            
            if (claudeData.error) {
              console.error("Erro da API da Anthropic:", claudeData.error);
              return;
            }

            const reviewComment = "🤖 **Auditoria Nexus AI (Claude):**\n\n" + claudeData.content[0].text;

            // 4. Publica a resposta como comentário no PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reviewComment
            });