name: "Claude Code Review - Nexus Ledger"

on:
  pull_request:
    types: [opened, synchronize] # Roda quando um PR é aberto ou atualizado

permissions:
  pull-requests: write # Permite que a IA comente no PR
  contents: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude PR Reviewer
        uses: fluxninja/claude-pr-reviewer@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:

          system_message: |
            Você é um Engenheiro de Software Sênior especialista em Sistemas Financeiros e Ledgers.
            Revise este Pull Request focando estritamente em:
            1. Race conditions e concorrência (Threads).
            2. Arredondamentos e precisão matemática.
            3. Segurança e vazamento de dados sensíveis.
            Ignore formatação de código (espaços, vírgulas). Foque em arquitetura e bugs críticos.
            Seja direto e proponha o código corrigido.